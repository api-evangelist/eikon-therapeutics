aid: eikon-therapeutics
name: Eikon Therapeutics
description: 'Eikon Therapeutics is a biopharmaceutical company (Nasdaq: EIKN) founded in 2019 and
  headquartered in Millbrae, California, with additional offices in New York and Jersey City. Eikon
  built a proprietary drug-discovery platform around single-molecule live-cell imaging, applying
  super-resolution fluorescence microscopy and high-throughput single-molecule tracking to observe
  how proteins and drug targets move and interact inside living cells in real time. The technology
  descends from co-founder Eric Betzig''s Nobel Prize-winning work in super-resolution microscopy,
  and the company is led by former Merck R&D chief Roger Perlmutter. Eikon uses these measurements to
  discover and develop novel therapeutics across oncology and other disease areas. This profile was
  surfaced as a portfolio company of Lux Capital and enriched by the API Evangelist pipeline; Eikon
  publishes a corporate and investor web presence but no public developer API, SDK, or machine-readable
  API surface at this time.'
